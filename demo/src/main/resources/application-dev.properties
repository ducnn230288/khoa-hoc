# --- dev profile ---

# Session
server.servlet.session.timeout=8h
server.servlet.session.cookie.secure=false
# NOTE: SameSite=None + Secure=false may be blocked by Chrome in cross-site context.
# Use Firefox or set up mkcert for local HTTPS testing if needed. (OI-C)

# Flyway: include seed directory for dev
spring.flyway.locations=classpath:db/migration,classpath:db/migration/seed

# Springdoc
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
