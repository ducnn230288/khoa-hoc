# --- dev profile ---

# Session
server.servlet.session.timeout=8h
server.servlet.session.cookie.secure=false
# Local dev uses the Vite proxy on localhost:5173, so Lax is enough and works in Chrome.
server.servlet.session.cookie.same-site=lax

# Flyway: include seed directory for dev
spring.flyway.locations=classpath:db/migration,classpath:db/migration/seed

# Springdoc
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
