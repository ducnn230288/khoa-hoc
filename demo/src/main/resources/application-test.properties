# --- test profile (used by Testcontainers integration tests) ---

# Flyway: include seed so test DB has admin/user01
spring.flyway.locations=classpath:db/migration,classpath:db/migration/seed

# Springdoc (not relevant in tests but keep consistent)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

server.servlet.session.timeout=1h
server.servlet.session.cookie.secure=false
